[package]
name = "fancontrollx"
version = "0.6.1"
edition = "2021"
rust-version = "1.82"
description = "Local Linux fan controller with an independent GPU recovery process"

[dependencies]
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
libloading = "0.8"
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

